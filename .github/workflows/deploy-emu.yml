name: CI/CD — RetroVault

on:
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'data.js'
      - 'script.js'
      - 'style.css'
      - 'favicon.ico'
      - 'tests/**'
      - '.github/workflows/**'

jobs:

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # gitleaks precisa do histórico completo

      - name: Segurança — segredos no repositório
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Unit — estrutura PLATFORMS[]
        run: node tests/unit/platforms.js

      - name: Unit — i18n PT/EN
        run: node tests/unit/i18n.js

      - name: Infra — catálogo de ROMs (valida no S3)
        run: node tests/infra/catalog.js

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sync files to S3
        run: |
          aws s3 cp index.html  s3://emu.dellabeneta.com/index.html
          aws s3 cp data.js     s3://emu.dellabeneta.com/data.js
          aws s3 cp script.js   s3://emu.dellabeneta.com/script.js
          aws s3 cp style.css   s3://emu.dellabeneta.com/style.css
          aws s3 cp favicon.ico s3://emu.dellabeneta.com/favicon.ico

      # Purge via API direta em vez de action de terceiro: o token não sai
      # do runner e a última linha reprova o job se a Cloudflare recusar —
      # antes, um token inválido falhava em silêncio.
      - name: Purge Cloudflare Cache
        env:
          CF_ZONE: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
        run: |
          RESP=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CF_ZONE}/purge_cache" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"files":["https://emu.dellabeneta.com/index.html","https://emu.dellabeneta.com/data.js","https://emu.dellabeneta.com/script.js","https://emu.dellabeneta.com/style.css","https://emu.dellabeneta.com/favicon.ico"]}')
          echo "$RESP"
          echo "$RESP" | grep -q '"success":true'

  smoke:
    name: Smoke Tests
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      # O site é restrito ao Brasil e o runner é estrangeiro. SMOKE_KEY é o
      # header de exceção na regra de WAF; sem ele tudo volta 403 e os
      # testes passam pelo motivo errado.
      - name: Infra — segurança Cloudflare
        env:
          SMOKE_KEY: ${{ secrets.SMOKE_KEY }}
          S3_ORIGIN_URL: ${{ secrets.S3_ORIGIN_URL }}
        run: bash tests/infra/security.sh
